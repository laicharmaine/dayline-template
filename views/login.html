<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Dayline · Sign in</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#5b3d9b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dayline">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true"><img src="/icon.svg" alt="" width="52" height="52"></div>
    <h1>Dayline</h1>
    <p class="muted">Your to-dos and calendars, on one calm screen.</p>
    <form id="loginForm" autocomplete="on">
      <label for="password" class="sr-only">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn primary block" id="loginBtn">Sign in</button>
      <p id="loginError" class="form-error" role="alert" hidden></p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
