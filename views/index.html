<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Dayline</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#5b3d9b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dayline">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="mbar" aria-label="Dayline">
    <a class="mbar-brand" href="#today"><img src="/icon.svg" alt="" width="26" height="26"><span>Dayline</span></a>
    <button class="mbar-btn" id="mRefresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 0 1-12.9 5.2"/><path d="M4.5 12a7.5 7.5 0 0 1 12.9-5.2"/><path d="M17.6 3.3v3.9h-3.9"/><path d="M6.4 20.7v-3.9h3.9"/></svg></button>
    <button class="mbar-btn" id="mSearch" type="button" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="mbar-btn primary" id="mAdd" type="button" aria-label="Add task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>
  <div class="shell">
    <nav class="nav" aria-label="Views">
      <div class="nav-brand"><img src="/icon.svg" alt="" width="28" height="28"><span>Dayline</span><span id="modePill" class="mode-pill" hidden>Sample data</span></div>
      <button class="nav-search" id="searchBtn" type="button" aria-label="Search (press /)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Search</span><kbd>/</kbd></button>
      <a href="#today" data-view="today" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
        <span>Today</span><kbd class="nav-kbd">1</kbd></a>
      <a href="#week" data-view="week" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Week</span><kbd class="nav-kbd">2</kbd></a>
      <a href="#tasks" data-view="tasks" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><path d="M4 6.5l1.2 1.2L7.3 5.5M4 12l1.2 1.2 2.1-2.2M4 17.5l1.2 1.2 2.1-2.2"/></svg>
        <span>Tasks</span><kbd class="nav-kbd">3</kbd></a>
      <a href="#jobs" data-view="jobs" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12.5" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/></svg>
        <span>Jobs</span><kbd class="nav-kbd">4</kbd></a>
      <a href="#opps" data-view="opps" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.4l-5.1 2.7 1-5.6-4.1-4 5.7-.8z"/></svg>
        <span>Opportunities</span><kbd class="nav-kbd">5</kbd></a>
      <a href="#chats" data-view="chats" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h11v4.2a4.3 4.3 0 0 1-4.3 4.3H8.8a4.3 4.3 0 0 1-4.3-4.3z"/><path d="M15.5 10.5h1.3a2.2 2.2 0 0 1 0 4.4h-1.6M4 20.5h12.5M8 3.5c-.8 1 .8 1.8 0 3M11.5 3.5c-.8 1 .8 1.8 0 3"/></svg>
        <span>Coffee chats</span><kbd class="nav-kbd">8</kbd></a>
      <a href="#classes" data-view="classes" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.6c0 1.6 2.5 3.4 5.5 3.4s5.5-1.8 5.5-3.4V11M21.5 9v5"/></svg>
        <span>Classes &amp; activities</span><kbd class="nav-kbd">6</kbd></a>
      <a href="#social" data-view="social" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/><path d="M15.5 15.5a2.8 2.8 0 1 0 0-5.6"/><path d="M3.8 19.2c.9-2 2.7-3.2 4.7-3.2s3.8 1.2 4.7 3.2M15.5 12.8c1.6.2 3 1.2 3.7 2.8"/><path d="M16.2 7.2l1.3-2.2M18.8 8.5l2.2-.6M18.5 10.8l2.1 1.1"/></svg>
        <span>Socializing</span><kbd class="nav-kbd">7</kbd></a>
      <div class="nav-quick">
        <button class="quick-btn" id="quickTask" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add task</span><kbd>N</kbd></button>
        <button class="quick-btn" id="quickJob" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add job</span><kbd>J</kbd></button>
      </div>
      <button class="nav-item nav-more" id="menuBtn" type="button" aria-label="Sources and sign out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>
        <span>More</span></button>
      <button class="nav-help" id="helpBtn" type="button"><span>Keyboard shortcuts</span><kbd>?</kbd></button>
    </nav>
    <main id="main" class="main" tabindex="-1" aria-live="polite"></main>
  </div>
  <nav class="tabbar" aria-label="Views">
    <a href="#today" data-tab="today" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><span>Today</span></a>
    <a href="#tasks" data-tab="tasks" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><path d="M4 6.5l1.2 1.2L7.3 5.5M4 12l1.2 1.2 2.1-2.2M4 17.5l1.2 1.2 2.1-2.2"/></svg><span>Tasks</span></a>
    <a href="#jobs" data-tab="jobs" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12.5" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/></svg><span>Jobs</span></a>
    <a href="#classes" data-tab="classes" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.6c0 1.6 2.5 3.4 5.5 3.4s5.5-1.8 5.5-3.4V11M21.5 9v5"/></svg><span>Classes</span></a>
    <a href="#chats" data-tab="chats" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h11v4.2a4.3 4.3 0 0 1-4.3 4.3H8.8a4.3 4.3 0 0 1-4.3-4.3z"/><path d="M15.5 10.5h1.3a2.2 2.2 0 0 1 0 4.4h-1.6M4 20.5h12.5M8 3.5c-.8 1 .8 1.8 0 3M11.5 3.5c-.8 1 .8 1.8 0 3"/></svg><span>Chats</span></a>
    <button type="button" data-tab="more" class="tab" id="mMore" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>More</span></button>
  </nav>
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
